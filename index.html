:root{--nav:#06152B;--nav-2:#2B446C;--orange:#FE9200;--page:#F2F5F8;--card:#FFFFFF;--line:#D9E2EB;--ink:#06152B;--muted:#4E6480;--info:#2B76E7;--ok:#1B6476;--warn:#B07A08;--bad:#C8413F;
--ok-t:#DDF3F3;--warn-t:#FDF0D3;--bad-t:#FBE4E3;--info-t:#E1ECFC;--neu-t:#E8EEF3;--ai-t:#FFF1DE;--steel:#809FB8;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--nav:#030B17;--nav-2:#1C2F4D;--page:#06152B;--card:#0D2038;--line:#22395A;--ink:#EAF0F6;--muted:#9DB3C7;--info:#6FA3F2;--ok:#3FCFD4;--warn:#F9C150;--bad:#F08583;
--ok-t:#0E3440;--warn-t:#3A2E12;--bad-t:#3B1C22;--info-t:#16315A;--neu-t:#172B46;--ai-t:#33240C;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font:14.5px/1.5 Barlow,"Helvetica Neue",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nav)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.top{background:var(--nav);color:#fff;display:flex;align-items:stretch;justify-content:space-between;padding:0 20px;min-height:60px}
.brand{display:flex;align-items:center;gap:9px;font:700 24px/1 "Barlow Condensed",sans-serif;letter-spacing:.12em;color:#fff;margin-right:22px;white-space:nowrap}
.brand svg{width:24px;height:24px}
.mods{display:flex;overflow-x:auto;scrollbar-width:none}
.mod{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:84px;padding:0 6px;font:600 11px/1.2 Barlow,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#fff;text-decoration:none;opacity:.78;border:0;background:none}
.mod svg,.rail svg,.util svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.util svg{color:#fff;opacity:.85}
.mod[href]{opacity:1;cursor:pointer}.mod[href]:hover{background:var(--nav-2)}
.mod.on{background:var(--orange);color:#06152B;font-weight:700}
.util{display:flex;align-items:center;gap:16px}
.deco{display:flex;align-items:center;gap:16px}.theme{display:inline-flex;align-items:center;gap:7px;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:2px;padding:6px 11px;font:600 11px/1 Barlow,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.theme:hover{border-color:var(--orange)}.theme svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}.theme .moon{display:none}html.is-dark .theme .sun{display:none}html.is-dark .theme .moon{display:block}.util b{width:32px;height:32px;border-radius:50%;background:#6B7280;border:2px solid #fff}
.proj{background:var(--nav-2);color:#C8D6E3;font-size:12px;padding:7px 24px 9px;display:flex;flex-wrap:wrap;gap:4px 14px}
.proj strong{color:#fff}.proj span+span::before{content:"/";margin-right:14px;color:var(--steel)}
.shell{display:flex;min-height:calc(100vh - 96px)}
.rail{width:92px;flex:none;background:var(--card);border-right:1px solid var(--line);padding-top:10px}
.rail a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;font:600 11px/1.2 Barlow,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-decoration:none;text-align:center}
.rail svg{width:22px;height:22px}
.rail a.on{background:var(--ai-t);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--orange)}.rail a.on svg{color:var(--orange)}
main{flex:1;min-width:0;padding:22px 24px 40px}
.view{display:none}.view.on{display:block}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.crumb{font:600 12px/1.2 Barlow,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.crumb b{color:var(--orange);font-weight:700}
h1{font:700 34px/1.02 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.01em;margin:6px 0 4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:13px}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:2px;padding:9px 18px;font:700 13px/1.2 Barlow,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#06152B}.btn.pri:hover:not(:disabled){background:#E88500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:3px;padding:3px 10px;font-size:11.5px;font-weight:700;background:var(--neu-t);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted)}
.chip.ok{background:var(--ok-t)}.chip.ok::before{background:var(--ok)}.chip.warn{background:var(--warn-t)}.chip.warn::before{background:var(--warn)}
.chip.bad{background:var(--bad-t)}.chip.bad::before{background:var(--bad)}.chip.info{background:var(--info-t)}.chip.info::before{background:var(--info)}
.ai{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--orange);background:var(--ai-t);border-radius:2px;padding:2px 7px;font-size:11.5px;font-weight:700;white-space:nowrap}
.ai::before{content:"✦";color:var(--orange)}
.banner{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:2px;padding:12px 16px;margin-bottom:16px;flex-wrap:wrap}
.banner p{margin:0;flex:1;min-width:220px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--steel);border-radius:2px;padding:14px 16px}
.stat b{display:block;font:700 34px/1 "Barlow Condensed",sans-serif;margin-bottom:4px}.stat span{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:860px}
th{background:var(--page);text-align:left;font:700 11.5px/1.2 Barlow,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.id{color:var(--info);font-weight:700;white-space:nowrap}
.filters{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.filters input,.filters select{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:8px 10px;min-width:150px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
.form{padding:22px 24px;display:grid;gap:18px}
label{display:block;font:700 11.5px/1.2 Barlow,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.form textarea,.form input,.form select{width:100%;border:1px solid var(--line);border-radius:2px;padding:9px 12px;background:var(--card)}
.form textarea{resize:vertical;min-height:84px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.presets button{border:1px dashed var(--steel);background:none;border-radius:2px;padding:4px 11px;font-size:12px;cursor:pointer;color:var(--muted)}
.presets button:hover{border-color:var(--orange);color:var(--ink)}
.panel{border:1px solid var(--line);border-top:3px solid var(--orange);border-radius:3px;background:var(--card);overflow:hidden}
.ph{background:var(--nav);color:#fff;padding:13px 20px;font:700 19px/1 "Barlow Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.ph::before{content:"✦";color:var(--orange)}
.sec{padding:15px 20px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{font:700 11.5px/1.2 Barlow,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.empty{padding:40px 24px;color:var(--muted);text-align:center}
.draft{white-space:pre-wrap;background:var(--page);border:1px solid var(--line);border-radius:2px;padding:10px 12px}
.cite{display:inline-block;border:1px solid var(--info);background:var(--info-t);color:var(--info);border-radius:2px;padding:2px 8px;font-size:12px;font-weight:700;margin:6px 6px 0 0}
.match{display:flex;justify-content:space-between;gap:10px;background:var(--page);border:1px solid var(--line);border-radius:2px;padding:9px 12px;margin-bottom:8px}
.match.dup{border-color:var(--orange)}
.opt{display:flex;align-items:flex-start;gap:10px;padding:6px 0;cursor:pointer;font:400 14.5px/1.4 Barlow,sans-serif;letter-spacing:0;text-transform:none;color:var(--ink);margin:0}.opt b{font-weight:700}.opt .why{display:block;margin:2px 0 0;font-weight:400}.opt input{margin-top:3px}
.opt input{accent-color:var(--orange);width:16px;height:16px}
.warnbox{background:var(--warn-t);border-left:3px solid var(--warn);border-radius:2px;padding:9px 12px;margin-bottom:10px;font-size:13px}
.why{color:var(--muted);font-size:12.5px;margin:6px 0 0}
.fine{color:var(--muted);font-size:12px;font-style:italic;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#06152B;color:#fff;padding:11px 20px;border-radius:2px;border-left:4px solid var(--orange);font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--ok)}.dot.w{background:var(--warn)}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
@media (max-width:760px){.rail{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}main{padding:16px}.deco{display:none}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

const STOP = new Set(["a","an","the","at","of","on","in","for","to","vs","and","with","through","by"]);
const LS = ["sprinkler","fire","alarm","egress","exit","pressurization","firestop","rated","smoke"], LS_EXEMPT = ["fire damper access"];
const SHEETS = Object.fromEntries(DATA.drawings.map(d => [d.Sheet, d.Consultant]));
const SPECS = Object.fromEntries(DATA.spec.map(s => [s.Section, s["Reviewing consultant"]]));

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toks = t => new Set((t.toLowerCase().match(/[a-z0-9-]+/g) || []).filter(w => !STOP.has(w)));
const r2 = x => Math.round(x * 100) / 100;

function findSimilar(subject, spec, before) {
  const a = toks(subject);
  const pool = DATA.rfis.filter(r => ["Closed","Answered"].includes(r.Status) && (!before || r["RFI #"] < before));
  const m = pool.map(r => { const b = toks(r.Subject); const inter = [...a].filter(x => b.has(x)).length; const uni = new Set([...a, ...b]).size;
    return {rfi: r["RFI #"], subject: r.Subject, score: r2(0.7 * (uni ? inter / uni : 0) + 0.3 * (spec === r["Spec section"]))}; })
    .sort((x, y) => y.score - x.score).slice(0, 3);

}
function suggestReviewer(dwg, spec) {

  if (d && s && d === s) return {c: [{who: d, why: `${dwg} and spec ${spec} both belong to this consultant`}], conf: 0.92};
  if (d && s) return {c: [{who: d, why: `issued ${dwg}`}, {who: s, why: `owns spec ${spec}`}], conf: 0.72};
  if (d || s) return {c: [{who: d || s, why: "only one reference resolved"}], conf: 0.65};
  return {c: [], conf: 0};
}
function lifeSafety(t) { const l = t.toLowerCase(); if (LS_EXEMPT.some(e => l.includes(e))) return []; return LS.filter(k => l.includes(k)); }
function gate(conf, ls, dropped) {
  if (ls.length) return {mode: "manual", reason: `Life-safety topic (${ls.join(", ")}): you route it.`};
  if (dropped.length) return {mode: "manual", reason: `Unresolved reference: ${dropped.join(", ")}.`};
  if (conf >= 0.85) return {mode: "one", reason: `Confidence ${Math.round(conf*100)}%: reviewer pre-selected.`};
  if (conf >= 0.60) return {mode: "two", reason: `Confidence ${Math.round(conf*100)}%: pick one of two.`};
  return {mode: "manual", reason: `Confidence ${Math.round(conf*100)}%: below threshold.`};
}
function assist(subject, note, dwg, spec, before) {
  const dropped = [dwg, spec].filter(x => x && !(x in SHEETS) && !(x in SPECS));

  return {route, ls, sim: findSimilar(subject, spec, before), refs: [dwg, spec].filter(x => !dropped.includes(x)), g: gate(route.conf, ls, dropped),

}

    <div class="row"><button class="btn" id="ret">Return to sub</button><button class="btn pri" id="toCon">Send to consultant</button></div></div>
    <div class="stats"><div class="stat"><b>${P.length}</b><span>Requirements checked</span></div><div class="stat"><b style="color:var(--ok)">${P.length - gaps.length - unclear.length}</b><span>Met</span></div>
    <div class="stat"><b style="color:var(--bad)">${gaps.length}</b><span>Gaps to fix</span></div><div class="stat"><b style="color:var(--warn)">${unclear.length}</b><span>Needs a person</span></div></div>
    <div class="split"><div class="card scroll"><table style="min-width:640px"><thead><tr><th>Requirement</th><th>Spec ref</th><th>Found in submittal</th><th>Result</th><th>Evidence</th></tr></thead>
    <tbody>${P.map(i => `<tr><td>${esc(i.requirement)}</td><td class="id">${i.ref}</td><td>${esc(i.found)}</td><td><span class="chip ${st[i.status][0]}">${st[i.status][1]}</span></td><td style="color:var(--info)">${esc(i.evidence)}</td></tr>`).join("")}</tbody></table></div>
    <aside class="panel"><div class="ph">AI Pre-check</div>
      <div class="sec"><h3>Likely outcome</h3>${gaps.length} gaps would likely bring this back as “revise and resubmit”. Fix them before it goes to Studio Arc.</div>
      <div class="sec"><h3>Return note to sub</h3><div class="form" style="padding:0;gap:8px"><textarea id="rn" aria-label="Return note">Please resubmit HW-12 with (1) Grade 1 closers per §2.5.A and (2) the 90-min fire rating label data per §2.1.C.</textarea></div>
        <div class="row" style="margin-top:8px"><span class="ai">AI drafted</span><span class="why" style="margin:0">Edit before sending</span></div></div>
      <div class="sec"><h3>Below confidence threshold</h3>${unclear.map(u => `<div class="row" style="gap:8px"><span class="ai">58%</span><b>${esc(u.requirement)}, ${u.ref}</b></div><p class="why">${esc(u.found)}, so the AI won’t judge it. Assigned to you.</p>`).join("")}</div>
      <div class="sec"><p class="fine">The AI checks the package against the spec. The consultant still reviews and stamps it.</p></div></aside></div>`;
  document.getElementById("ret").onclick = () => toast("Returned to Keystone Hardware with your note");
  document.getElementById("toCon").onclick = () => toast(gaps.length ? `${gaps.length} gaps still open. Return to sub first, or send anyway from the full app.` : "Sent to Studio Arc");
}

/* ---------- routing ---------- */
renderLog(); renderDraft(); renderPre();
function show() {
  const v = ["log","draft","precheck"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "log";
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  document.querySelectorAll(".rail a").forEach(a => a.classList.toggle("on", a.dataset.v === v));
  document.querySelectorAll(".mod[data-mod]").forEach(a => a.classList.toggle("on", a.dataset.mod === (v === "precheck" ? "sub" : "rfi")));
  window.scrollTo(0, 0);
}
addEventListener("hashchange", show); show();
</script>
</body>
</html>
